# Local stack for the SDLC Knowledge Graph.
#
#   docker compose up -d --build --wait        # full stack: neo4j + Keycloak (8081) + backend (8080)
#                                              # + frontend (5173), behind a login: sign in as dan / dan
#   docker compose up -d neo4j keycloak        # database and login only (run backend/frontend from
#                                              # source; docs/GETTING-STARTED.md)
#   AUTH_ISSUER_URI= OIDC_AUTHORITY= SDLC_READ_ONLY=true docker compose up -d --build --wait
#                                              # no login: the anonymous read-only mode (docs/AUTH.md)
#   docker compose --profile governance up -d  # + OPA (8181) for policy-as-code
#   docker compose --profile monitoring up -d --build --wait   # + Prometheus (9090), Alertmanager (9093), Grafana (3000)
#   docker compose down -v                     # stop and wipe the graph
name: sdlc-knowledge-graph

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  backend:
    build:
      context: ./backend
      # The commit /actuator/info reports (docs/DEPLOYMENT.md D2). CI sets it; a local build says "unknown".
      args:
        SDLC_COMMIT: ${SDLC_COMMIT:-}
    image: sdlc-graph-backend:local
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      SPRING_PROFILES_ACTIVE: docker
      # Writable by default, which is what local work and the browser suite need. CI restarts the
      # backend read-only to run the deployment conformance suite against it.
      SDLC_READ_ONLY: ${SDLC_READ_ONLY:-false}
      # Behind the Keycloak below (#118). Keycloak is two addresses at once: the browser reaches it at
      # localhost:8081, so that is the issuer every token names and the API must expect, while the API,
      # inside the compose network, fetches the signing keys from keycloak:8080. Hence an issuer and a
      # separate key set URI. Set AUTH_ISSUER_URI to empty (not unset) for the anonymous read-only
      # mode, which the API starts only with SDLC_READ_ONLY=true.
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI-http://localhost:8081/realms/sdlc}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI-http://keycloak:8080/realms/sdlc/protocol/openid-connect/certs}
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
      # Not needed to start, since the keys are fetched on first use, but a stack whose login page is
      # not up yet is not up.
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    image: sdlc-graph-frontend:local
    environment:
      # The realm the web interface signs users in with. Empty means no login, for a backend running
      # the anonymous read-only mode.
      OIDC_AUTHORITY: ${OIDC_AUTHORITY-http://localhost:8081/realms/sdlc}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-sdlc-ui}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to [::1] first and nginx listens
      # on IPv4 only, so the IPv6 attempt is refused and the container never reports healthy.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Local OIDC provider (docs/adr/0005-auth-oidc-github-first.md, docs/AUTH.md), part of the default
  # stack since authentication is on by default (#118). Admin console: http://localhost:8081 (admin /
  # admin). It imports the development realm the acceptance suite signs in against: realm "sdlc", the
  # public PKCE client "sdlc-ui" for the web interface, the users "dan" (both graph scopes), "reader"
  # (graph:read) and "visitor" (neither), each with their name as password, and the
  # client-credentials clients "github-connector" and "triage-agent". Development values only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./backend/src/acceptanceTest/resources/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    healthcheck:
      # The image has no curl or wget, so bash asks the management port directly.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  # Policy-as-code engine for RBAC decisions (M3). Policies will be mounted from policy/ once #30 lands.
  opa:
    profiles: ["governance"]
    image: openpolicyagent/opa:0.70.0
    command: ["run", "--server", "--addr", ":8181", "--log-level", "info"]
    ports:
      - "8181:8181"

  # Prometheus and Alertmanager, from the image the dogfood instance runs (#47 FR12): the rules in
  # ops/alerts, the routes in ops/alertmanager. Alerts go to alert-sink, which logs every delivery.
  monitoring:
    profiles: ["monitoring"]
    build:
      context: ./ops
      dockerfile: monitoring/Dockerfile
    image: sdlc-graph-monitoring:local
    environment:
      BACKEND_ADDR: backend:8080
      ALERTMANAGER_WEBHOOK_URL: http://alert-sink/alerts
    ports:
      - "9090:9090"
      - "9093:9093"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready && wget -q -O /dev/null http://localhost:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  # A webhook receiver that accepts anything and logs it, standing in for the real one.
  alert-sink:
    profiles: ["monitoring"]
    image: nginx:1.27-alpine
    command: ["sh", "-c", "echo 'server { listen 80; location / { return 200; } }' > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]

  # Grafana with the sync dashboard (#29, FR9), reading the Prometheus above. Local only: the dogfood
  # instance does not run it (docs/OBSERVABILITY.md, Dashboards). Anyone who can reach the port sees
  # the dashboards as a viewer without signing in, which is why it is never deployed like this.
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sdlc-sync-dashboard.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      monitoring:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  neo4j-data:
