# Local stack for the SDLC Knowledge Graph.
#
#   docker compose up -d neo4j                 # database only (run backend/frontend from source)
#   docker compose up -d --build --wait        # full stack: neo4j + backend (8080) + frontend (5173)
#   docker compose --profile auth up -d        # + Keycloak (8081) as the local OIDC provider
#   docker compose --profile governance up -d  # + OPA (8181) for policy-as-code
#   docker compose down -v                     # stop and wipe the graph
name: sdlc-knowledge-graph

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: sdlc-graph-backend:local
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    image: sdlc-graph-frontend:local
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to [::1] first and nginx listens
      # on IPv4 only, so the IPv6 attempt is refused and the container never reports healthy.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Local OIDC provider stand-in (see docs/adr/0005-auth-oidc-github-first.md). Admin console: http://localhost:8081
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

  # Policy-as-code engine for RBAC decisions (M3). Policies will be mounted from policy/ once #30 lands.
  opa:
    profiles: ["governance"]
    image: openpolicyagent/opa:0.70.0
    command: ["run", "--server", "--addr", ":8181", "--log-level", "info"]
    ports:
      - "8181:8181"

volumes:
  neo4j-data:
