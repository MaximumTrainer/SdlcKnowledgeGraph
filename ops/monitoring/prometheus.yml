# Prometheus for a deployment of the API (#47 FR12). /bin/monitoring replaces __BACKEND_ADDR__ with
# $BACKEND_ADDR at start. The job name is fixed: the rules in ops/alerts select on it.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/rules/generated/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: sdlc-graph-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["__BACKEND_ADDR__"]
