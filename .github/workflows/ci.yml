name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole of CI on the tagged commit before it publishes anything.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists the pull request's commits through the API, which needs this scope.
      # Without it the request is rejected and the job fails without linting anything.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs

  guards:
    name: Guards (hygiene, secrets, hook config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The same checks the pre-commit hook runs, over every tracked file rather than the staged ones.
      # Hooks are bypassable with LEFTHOOK=0 (ADR-0001), so the gate that cannot be skipped re-runs
      # them: unresolved conflict markers, oversized files, credential files, leaked secrets, and a
      # lefthook.yml that still parses.
      - run: npm run guards
      # The image the dogfood instance monitors itself with (#47).
      - name: Lint the monitoring Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ops/monitoring/Dockerfile
          config: .hadolint.yaml
      # The alert rules (#44): the generated burn-rate rules match ops/slo.yaml, every rule file is
      # valid, and every promtool case passes. promtool runs from the pinned Prometheus image,
      # and amtool, which checks the Alertmanager routes, from the pinned Alertmanager image.
      - name: Alert rules are current and pass their tests
        run: |
          node scripts/slo-rules.mjs --check
          node scripts/promtool.mjs
      # The Grafana dashboard (#29, FR9) reads only the metrics docs/OBSERVABILITY.md lists, and every
      # panel's query parses, checked by promtool from the same pinned image.
      - name: The dashboard reads only documented metrics
        run: node scripts/dashboard.mjs
      # The authorisation policy (#30, #95, ADR-0020): the Rego is formatted, every Rego unit test
      # passes, and the WebAssembly bundle the API evaluates is what that Rego compiles to. opa runs
      # from an image pinned by version and digest (scripts/opa.mjs), the same one the hooks use.
      - name: The authorisation policy is formatted, tested and current
        run: |
          node scripts/opa.mjs fmt
          node scripts/opa.mjs test
          node scripts/opa.mjs check

  root-scripts:
    # The guards decide whether a commit is allowed, and their failure mode is silent: one that has
    # stopped refusing looks exactly like one with nothing to refuse. Both platforms are run because
    # path separators and line endings are where these scripts break - see #53, which was exactly
    # that, and was invisible in CI precisely because CI only ran Linux.
    name: Root scripts (guard unit tests)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:unit

  backend:
    name: Backend (unit, integration, acceptance, contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yaml
      # The code generator and the ontology lint live in buildSrc, whose tests the main build cannot
      # reach (backend/buildSrc/build.gradle.kts); the lint's rules are tested here (#81).
      - name: Test the build logic (codegen and ontology lint)
        run: ./gradlew -p buildSrc test --no-daemon
      # check includes ontologyLint and ontologyDriftCheck as well as every test suite.
      - name: Lint and run all test suites
        run: ./gradlew check --no-daemon
      - name: Upload test and Cucumber reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests/
            backend/build/reports/cucumber/
            backend/build/reports/detekt/
            backend/build/reports/ktlint/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          config: .hadolint.yaml
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit -- --run --coverage
      - run: npm run test:contract
      # The pact is generated from the consumer specs and committed, so the provider verifies the
      # same document the frontend actually needs. A regenerated pact that differs means the specs
      # moved without it (ADR-0004).
      - name: Fail when the committed pact is stale
        run: git diff --exit-code -- ../contracts/pacts
      - run: npm run build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  website:
    name: Website (generate, drift, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run generate
      # Every page is generated from a repository source. A diff here means a source moved without
      # the page that renders it, which is the drift the whole arrangement exists to prevent.
      - name: Fail when a generated page is stale
        run: git diff --exit-code -- src
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      # The Website workflow publishes exactly these bytes rather than rebuilding, so what reaches
      # the reader is what was tested here.
      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/.vitepress/dist
          if-no-files-found: error

  e2e:
    name: End-to-end (compose + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build --wait
        env:
          SDLC_COMMIT: ${{ github.sha }}
      - name: Report the image sizes
        run: |
          {
            echo "### Image sizes"
            echo
            echo "| Image | Size |"
            echo "| --- | --- |"
            for image in sdlc-graph-backend:local sdlc-graph-frontend:local; do
              bytes=$(docker image inspect --format '{{.Size}}' "$image")
              echo "| \`$image\` | $((bytes / 1024 / 1024)) MB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # Every line the API writes is one JSON object a platform can aggregate, and a request's
      # correlation id reaches it through nginx and comes back (#44).
      - name: The API logs JSON and echoes the request id
        run: |
          id=$(curl -s -D - -o /dev/null -H 'X-Request-Id: ci-trace-1' http://localhost:5173/api/v1/ontology \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "x-request-id" { print $2 }')
          if [ "$id" != "ci-trace-1" ]; then
            echo "::error::X-Request-Id came back as '$id', not ci-trace-1"
            exit 1
          fi
          # The JVM announces JAVA_TOOL_OPTIONS on stderr before any logger exists; that one line is not the API's.
          logs=$(docker compose logs --no-log-prefix --no-color backend | grep -v '^Picked up JAVA_TOOL_OPTIONS: ')
          if grep -v '^{' <<<"$logs" | grep -q .; then
            grep -v '^{' <<<"$logs" | head -20
            echo "::error::the API wrote log lines that are not JSON"
            exit 1
          fi
          jq -s -e 'length > 0 and all(has("@timestamp") and has("level") and .service == "sdlc-graph-backend")' <<<"$logs" >/dev/null
      # A scraper inside the deployment can read the metrics; the web interface does not proxy them (#44).
      - name: The API publishes its metrics inside the stack only
        run: |
          docker compose exec -T backend curl -sf http://localhost:8080/actuator/prometheus | grep -q '^sdlc_build_info{'
          # The web interface answers an unknown path with its own page, so the test is the body, not the status.
          if curl -s http://localhost:5173/actuator/prometheus | grep -q 'sdlc_build_info'; then
            echo "::error::/actuator/prometheus is reachable through the web interface"
            exit 1
          fi
      # What the dogfood instance's monitoring machine checks after every deploy (#47 FR12, D10): it
      # scrapes the API, has loaded the rules, and delivers an alert to the webhook receiver.
      # --no-deps: the API is already up, and building it again here would drop its SDLC_COMMIT.
      - name: Prometheus scrapes the API and an alert reaches the receiver
        run: |
          docker compose --profile monitoring up -d --build --no-deps --wait monitoring alert-sink
          docker compose exec -T monitoring deploy-check
          docker compose logs alert-sink | grep -q '"POST /alerts'
      # The dashboard the sync meters are read on (#29, FR9): Grafana has provisioned it and its
      # Prometheus datasource, the datasource reaches Prometheus, and what the API reported arrives
      # through it. --no-deps for the same reason as above; Prometheus is already up. Grafana reports
      # healthy before its datasource answers, so the datasource checks poll for up to a minute and
      # print what Grafana last said when they give up.
      - name: Grafana serves the sync dashboard from Prometheus
        run: |
          docker compose --profile monitoring up -d --no-deps --wait grafana
          curl -sf http://localhost:3000/api/health | jq -e '.database == "ok"'
          curl -sf 'http://localhost:3000/api/search?query=SDLC%20sync' | jq -e 'any(.uid == "sdlc-sync")'
          poll() {
            for _ in $(seq 30); do
              body=$(curl -s "$1") && jq -e "$2" <<<"$body" >/dev/null 2>&1 && return 0
              sleep 2
            done
            echo "::error::$1 never satisfied $2; last response: $body"
            return 1
          }
          poll http://localhost:3000/api/datasources/uid/prometheus/health '.status == "OK"'
          poll 'http://localhost:3000/api/datasources/proxy/uid/prometheus/api/v1/query?query=sdlc_graph_nodes' \
            '.data.result | length > 0'
      # A container without its database setting must refuse to start rather than come up broken.
      - name: The API refuses to start without NEO4J_URI
        run: |
          if output=$(timeout 60 docker compose run --rm --no-deps -e NEO4J_URI= backend 2>&1); then
            echo "::error::the API started without NEO4J_URI"
            exit 1
          fi
          if ! grep -q "NEO4J_URI must be set" <<<"$output"; then
            echo "$output"
            echo "::error::the API did not say NEO4J_URI must be set"
            exit 1
          fi
      # No anonymous path remains (#118): the development bypass is not a setting any more, and an
      # instance with no identity provider that would accept writes refuses to start, naming both
      # settings (#48 FR6, docs/DEPLOYMENT.md D13).
      - name: The API refuses AUTH_DISABLED as an unknown setting
        run: |
          if output=$(timeout 60 docker compose run --rm --no-deps -e AUTH_DISABLED=true backend 2>&1); then
            echo "::error::the API started with AUTH_DISABLED=true"
            exit 1
          fi
          if ! grep -q "AUTH_DISABLED is not a setting" <<<"$output"; then
            echo "$output"
            echo "::error::the API did not refuse AUTH_DISABLED as an unknown setting"
            exit 1
          fi
      - name: The API refuses to start writable without an identity provider
        run: |
          if output=$(timeout 60 docker compose run --rm --no-deps -e AUTH_ISSUER_URI= -e SDLC_READ_ONLY=false backend 2>&1); then
            echo "::error::the API started writable with no identity provider"
            exit 1
          fi
          if ! grep -q "AUTH_ISSUER_URI is not set and SDLC_READ_ONLY is not true" <<<"$output"; then
            echo "$output"
            echo "::error::the API did not name AUTH_ISSUER_URI and SDLC_READ_ONLY"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # The browser suite runs against the default stack, behind the Keycloak login (#118): it signs
      # dan in through the real login page first, and covers the reader, a registered connector's
      # write and an unregistered one.
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: "true"
      # The conformance suite (docs/DEPLOYMENT.md) has to be able to fail, so it is first run against
      # the writable stack the browser tests need, where D5 must fail; then against the same stack
      # with the API restarted in the anonymous read-only mode, where every requirement must pass.
      - name: Conformance suite refuses a writable deployment
        working-directory: e2e
        env:
          CONFORMANCE_BASE_URL: http://localhost:5173
        run: |
          if npx playwright test --config=conformance.config.ts --grep "D5 a POST"; then
            echo "::error::the conformance suite passed D5 against a writable deployment"
            exit 1
          fi
      # How the dogfood instance runs (fly/fly.backend.toml): read-only, with no identity provider.
      - name: Restart the API in the anonymous read-only mode
        run: docker compose up -d --wait backend
        env:
          SDLC_READ_ONLY: "true"
          AUTH_ISSUER_URI: ""
      - name: The anonymous read-only mode serves reads and refuses writes
        run: |
          curl -sf http://localhost:5173/actuator/info | jq -e '.deployment.authentication == "anonymous-read-only"'
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/v1/nodes/Repository)
          if [ "$status" != 200 ]; then
            echo "::error::an anonymous read answered $status, not 200"
            exit 1
          fi
          body=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"props":{"name":"ci"}}' \
            http://localhost:5173/api/v1/nodes/Team)
          if [ "$(jq -r .error <<<"$body")" != "this instance is read-only" ]; then
            echo "::error::an anonymous write answered $body"
            exit 1
          fi
          # And it says so, by name, on every start.
          docker compose logs --no-log-prefix --no-color backend | grep '^{' \
            | jq -s -e 'any(.event == "auth.anonymous.readonly" and .level == "WARN")' >/dev/null
      - name: Deployment conformance
        working-directory: e2e
        env:
          CI: "true"
          CONFORMANCE_BASE_URL: http://localhost:5173
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npx playwright test --config=conformance.config.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile monitoring logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --profile monitoring down -v
