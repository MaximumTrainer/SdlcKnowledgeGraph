# Keeps dependency updates arriving continuously instead of accumulating into a backlog.
#
# Enabling alerts on this repository surfaced 48 of them at once, 19 high (#68). None were new; they
# had simply never been reported. Weekly grouped pull requests are the point of this file: a steady
# trickle that gets reviewed, rather than a pile nobody can face.
#
# Grouping matters as much as the schedule. Ungrouped, the backlog above would have opened forty
# pull requests, and forty pull requests get ignored exactly like one enormous one does. Minor and
# patch updates are grouped per ecosystem; majors are left to arrive on their own, because those are
# the ones that need a person to look at a changelog.
version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /            # lefthook, commitlint, secretlint - the commit gates
      - /frontend    # the Vue application and its toolchain
      - /website     # the generated documentation site
      - /e2e         # Playwright, against the compose stack
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # commitlint enforces conventional commits with a known scope, and rejects anything else, so a
      # Dependabot pull request that does not use one cannot be merged (see commitlint.config.cjs).
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    groups:
      # One pull request per ecosystem for the routine updates. Security fixes are grouped too: the
      # whole problem this file solves is a backlog of small, individually unremarkable bumps.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    # Majors blocked by something outside this repository. Each ignores the *major* only, so a patch
    # to the line we are on still arrives, and each names what would unblock it (#125). An ignore is
    # a decision with an expiry, not a pin: ADR-0008 says where these are reviewed.
    ignore:
      # typescript-eslint declares `peer typescript@">=4.8.4 <6.1.0"`, so npm cannot resolve
      # TypeScript 7 at all. Unblocks when typescript-eslint widens its peer range (#108).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # The workflows pin actions by major version, so this mostly catches an action that has moved on a
  # major - which is the case that silently stops a job from being maintained.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Gradle and the Spring Boot BOM. The backend was not in the alert backlog, which is not the same
  # as being up to date - nothing was watching it.
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    # See the npm block above for why these exist and how they are reviewed (#125).
    ignore:
      # detekt 1.23.8 is the latest release and is built against Kotlin 2.0.21, so a Kotlin beyond
      # that fails `:detekt` with a "compiled with ... running with ..." mismatch. Grouping means one
      # incompatible member blocks the whole backend group, so this is ignored by name rather than
      # the group being abandoned. Unblocks when a detekt release supports the Kotlin line (#109).
      #
      # `jvm` and `plugin.spring`, not the plugin IDs: build.gradle.kts declares these as
      # `kotlin("jvm")` and `kotlin("plugin.spring")`, and Dependabot names a dependency after the
      # accessor it finds rather than after what the plugin resolves to. Taken from the
      # `updated-dependencies:` block of its own commits, which is the only authority on this - the
      # first attempt used the plugin IDs, matched nothing, and the update arrived again (#125).
      - dependency-name: jvm
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: plugin.spring
        update-types: [version-update:semver-minor, version-update:semver-major]
      # springdoc 3 targets Spring Framework 7 / Spring Boot 4, so this major is a Spring Boot 4
      # migration wearing a different name and belongs in an issue of its own, not a dependency bump.
      # Unblocks when the backend moves to Boot 4 (#111).
      #
      # Minors are held too: 2.9.x wants Spring Boot 3.5+, and on 3.4.3 every Spring context fails to
      # start with PatternParseException. Measured, not inferred (#138).
      - dependency-name: org.springdoc:springdoc-openapi-starter-webmvc-ui
        update-types: [version-update:semver-minor, version-update:semver-major]
      # The 4.7.x jars carry Kotlin metadata newer than 2.0.21 can read, so :compileContractTestKotlin
      # fails - and detekt 1.23.8 refuses any Kotlin but 2.0.21. That circular constraint is the whole
      # of #138: one of the two has to move first and neither can, so the upgrade is coordinated
      # rather than incremental.
      - dependency-name: au.com.dius.pact.provider:junit5spring
        update-types: [version-update:semver-minor, version-update:semver-major]
      # Spring Boot 4 fails :compileKotlin outright. It is the migration that unblocks springdoc, so it
      # is the first step of #138 rather than a bump to take on its own.
      - dependency-name: org.springframework.boot
        update-types: [version-update:semver-major]
      # 7.34.x fails acceptanceTest with "TestEngine with ID 'junit-platform-suite' failed to discover
      # tests"; it needs a JUnit platform this project does not have yet (#138).
      - dependency-name: io.cucumber:cucumber-java
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: io.cucumber:cucumber-spring
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: io.cucumber:cucumber-junit-platform-engine
        update-types: [version-update:semver-minor, version-update:semver-major]
