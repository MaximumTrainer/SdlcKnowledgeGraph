# Every event the application may log (#44, docs/OBSERVABILITY.md).
#
# One entry per event: a dot-separated name shaped like the domain rather than the code, a level, a
# fixed message, a description, and the fields it carries, typed with the ontology's wire names
# (string, int, boolean, instant, string[]). `throwable: true` means the event records a failure and
# takes the exception; `security: true` marks it for whoever watches for abuse.
#
# After changing this file, run ./gradlew generateLogEvents and commit LogEvents.kt and events.json.
# logEventDriftCheck fails the build until you do, and nothing may log except through LogEvents.
events:
  # The API
  - name: node.created
    level: INFO
    message: node created
    description: A node was created through the API. Names the properties supplied, never their values.
    fields:
      - { name: type, type: string }
      - { name: key, type: string }
      - { name: properties, type: "string[]" }
  - name: node.renamed
    level: INFO
    message: node renamed
    description: A node moved to a new key through its alias, such as a repository renamed on its provider (#88). Names the keys it left and took.
    fields:
      - { name: type, type: string }
      - { name: from, type: string }
      - { name: to, type: string }
  - name: node.merged
    level: INFO
    message: node merged
    description: One node was merged into another of its type (#98), by a person through the API or automatically when an artifact's digest was seen. Names both keys, how many edges moved, and who merged it.
    fields:
      - { name: type, type: string }
      - { name: from, type: string }
      - { name: into, type: string }
      - { name: edgesMoved, type: int }
      - { name: automatic, type: boolean }
      - { name: by, type: string }
  - name: node.merge.skipped
    level: WARN
    message: node merge skipped
    description: An automatic merge found when an artifact's digest was seen was not made, because the graph changed under it (#98). Names both keys and the refusal; the write that found it stands.
    fields:
      - { name: type, type: string }
      - { name: from, type: string }
      - { name: into, type: string }
      - { name: reason, type: string }
  - name: node.rejected
    level: INFO
    message: node rejected
    description: A node write was refused by the ontology. Names the fields at fault, never their values.
    fields:
      - { name: type, type: string }
      - { name: fields, type: "string[]" }
  - name: edge.created
    level: INFO
    message: edge created
    description: An edge was created through the API.
    fields:
      - { name: type, type: string }
      - { name: from, type: string }
      - { name: to, type: string }
  - name: graph.store.failed
    level: ERROR
    message: graph store operation failed
    description: A graph store operation failed for a reason other than the domain refusing it, such as Neo4j being unreachable.
    throwable: true
    fields:
      - { name: operation, type: string }
  - name: graph.count.failed
    level: WARN
    message: graph count failed; keeping the last counts
    description: Counting the graph's nodes and edges by type failed, so sdlc_graph_nodes and sdlc_graph_edges keep their last values.
    throwable: true
    fields: []
  - name: http.request.rejected
    level: DEBUG
    message: request rejected as malformed
    description: A request was refused with 400 because its arguments could not be read.
    throwable: true
    fields: []
  - name: ingest.deployment.received
    level: INFO
    message: deployment report received
    description: The deploy pipeline reported a deployment, which was applied.
    fields:
      - { name: deployments, type: int }
      - { name: created, type: boolean }
  - name: ingest.seed.received
    level: INFO
    message: seed batch received
    description: The dogfood seed posted a batch, which was applied.
    fields:
      - { name: nodes, type: int }
      - { name: edges, type: int }
      - { name: created, type: boolean }
  - name: ingest.unauthorized
    level: WARN
    message: ingest refused without a valid token
    description: Someone posted to an ingest endpoint without the ingest token.
    security: true
    fields:
      - { name: endpoint, type: string }

  # Service principals (#115)
  - name: principal.registered
    level: INFO
    message: service principal registered
    description: A user registered an identity provider client as a service principal, owned by a team. From now on the client's tokens are let in and its writes are attributed to it.
    security: true
    fields:
      - { name: name, type: string }
      - { name: ownedBy, type: string }
      - { name: registeredBy, type: string }
  - name: principal.deregistered
    level: INFO
    message: service principal deregistered
    description: A user ended a service principal's registration. The record is kept with a validTo, and the client's tokens are refused from now on.
    security: true
    fields:
      - { name: name, type: string }
      - { name: deregisteredBy, type: string }
  - name: principal.refused
    level: WARN
    message: token from an unregistered client refused
    description: A token the identity provider signed for a client, with no user in it, was refused with 403 because no current service principal registration names the client. Either a client nobody registered, or one since deregistered, is calling the API.
    security: true
    fields:
      - { name: clientId, type: string }

  # Scopes (#116)
  - name: scope.refused
    level: WARN
    message: request refused for insufficient scope
    description: A principal the API knows was refused with 403 because its token lacks a graph scope the request needs - graph:read to read, graph:write to change the graph. Names the principal, the method and the scopes, never the path, which can hold a node's key.
    security: true
    fields:
      - { name: principal, type: string }
      - { name: method, type: string }
      - { name: required, type: "string[]" }
      - { name: held, type: "string[]" }

  # Startup
  - name: auth.anonymous.readonly
    level: WARN
    message: no identity provider; serving reads to anyone and refusing every write
    description: The API started with no AUTH_ISSUER_URI, the anonymous read-only mode (#118). Reads need no token and every write is refused as read-only, so nothing is written by nobody; AuthGuard lets this start only with SDLC_READ_ONLY=true. Logged on every start.
    security: true
    fields: []
  - name: ontology.constraints.ensured
    level: INFO
    message: key constraints ensured
    description: The store has a uniqueness constraint on the key of every node type.
    fields:
      - { name: nodeTypes, type: int }
  - name: ontology.version.recorded
    level: INFO
    message: ontology version recorded
    description: The ontology version this instance runs was written to the graph.
    fields:
      - { name: version, type: string }
  - name: ontology.migration.baselined
    level: INFO
    message: ontology migration recorded as a baseline
    description: A shipped migration was recorded as applied without running, because the graph began on its version or a newer one and never held the shape it repairs (#33).
    fields:
      - { name: migration, type: string }
  - name: ontology.migration.applied
    level: INFO
    message: ontology migration applied
    description: A migration ran in a transaction of its own and was recorded on the graph with its checksum (#33).
    fields:
      - { name: migration, type: string }
      - { name: statements, type: int }
      - { name: durationMs, type: int }
  - name: ontology.migration.failed
    level: ERROR
    message: ontology migration failed and was rolled back
    description: A migration failed; its transaction was rolled back, so the graph is as it was before it, and nothing after it ran. At startup the application stops (#33).
    throwable: true
    fields:
      - { name: migration, type: string }
  - name: ontology.migrations.pending
    level: WARN
    message: ontology migrations are pending
    description: In manual mode the application started with migrations the graph has not had; an admin applies them from the lifecycle page. Health is not affected (#33).
    fields:
      - { name: dbVersion, type: string }
      - { name: registryVersion, type: string }
      - { name: pending, type: "string[]" }

  # The data lifecycle
  - name: lifecycle.archive.scheduled
    level: INFO
    message: archive scheduled
    description: The archive is enabled and will run on a schedule, in the mode it names (#33).
    fields:
      - { name: cron, type: string }
      - { name: mode, type: string }
  - name: lifecycle.archive.finished
    level: INFO
    message: archive run finished
    description: An archive run finished. A dry run changed nothing; export wrote the file; purge wrote the file and then deleted what it wrote (#33).
    fields:
      - { name: mode, type: string }
      - { name: dryRun, type: boolean }
      - { name: cutoff, type: instant }
      - { name: nodes, type: int }
      - { name: edges, type: int }
  - name: lifecycle.archive.failed
    level: WARN
    message: archive run failed
    description: A scheduled archive run could not finish. Nothing is purged that was not first written; the next run retries (#33).
    throwable: true
    fields:
      - { name: mode, type: string }

  # Link resolution (#28)
  - name: links.scheduled
    level: INFO
    message: link resolution scheduled
    description: The link engine will resolve every cloud resource on a schedule, as a FULL run of link-engine.
    fields:
      - { name: cron, type: string }
  - name: links.resolution.triggered
    level: INFO
    message: link resolution triggered by a sync run
    description: A connector's run touched resources or repositories, so a resolution scoped to them was started. Names both runs.
    fields:
      - { name: connector, type: string }
      - { name: runId, type: string }
      - { name: linkRunId, type: string }
  - name: links.rule.failed
    level: WARN
    message: link rule failed; the resource is left as it was
    description: A link rule could not read a resource's evidence, so that resource was not resolved in this run, which is partial.
    throwable: true
    fields:
      - { name: runId, type: string }
      - { name: resourceKey, type: string }
  - name: links.candidate.accepted
    level: INFO
    message: candidate link accepted
    description: A person accepted a candidate link, which became a manual OWNS_RESOURCE. Names the candidate, both ends and who accepted it.
    fields:
      - { name: candidateId, type: string }
      - { name: resourceKey, type: string }
      - { name: repoKey, type: string }
      - { name: by, type: string }
  - name: links.candidate.rejected
    level: INFO
    message: candidate link rejected
    description: A person rejected a candidate link; it is not proposed again while its evidence is the same. Names the candidate, both ends and who rejected it.
    fields:
      - { name: candidateId, type: string }
      - { name: resourceKey, type: string }
      - { name: repoKey, type: string }
      - { name: by, type: string }
  - name: links.manual.stated
    level: INFO
    message: manual link stated
    description: A person stated that a repository owns a cloud resource. Names both ends and who stated it.
    fields:
      - { name: resourceKey, type: string }
      - { name: repoKey, type: string }
      - { name: by, type: string }
  - name: links.manual.closed
    level: INFO
    message: manual link closed
    description: A person closed a manual link; the edge keeps its history with validTo set. Names both ends and who closed it.
    fields:
      - { name: resourceKey, type: string }
      - { name: repoKey, type: string }
      - { name: by, type: string }

  # Connectors
  - name: connector.scheduled
    level: INFO
    message: connector scheduled
    description: A connector will sync on a schedule.
    fields:
      - { name: connector, type: string }
      - { name: cron, type: string }
  - name: connector.schedule.skipped
    level: INFO
    message: scheduled sync skipped
    description: A scheduled sync did not start, and why.
    fields:
      - { name: connector, type: string }
      - { name: reason, type: string }
  - name: connector.run.failed
    level: ERROR
    message: connector run failed
    description: A sync run failed as a whole.
    throwable: true
    fields:
      - { name: connector, type: string }
      - { name: runId, type: string }
  - name: connector.page.failed
    level: WARN
    message: connector page failed; the run is partial
    description: A connector failed to read one page, so its run is partial.
    throwable: true
    fields:
      - { name: connector, type: string }
      - { name: runId, type: string }
  - name: connector.page.unapplied
    level: WARN
    message: connector page could not be applied
    description: A page a connector read could not be written to the graph.
    throwable: true
    fields:
      - { name: connector, type: string }
      - { name: runId, type: string }
  - name: connector.delivery.duplicate
    level: INFO
    message: webhook delivery already applied
    description: A webhook delivery had already been applied by an earlier run, so nothing changed.
    fields:
      - { name: connector, type: string }
      - { name: deliveryId, type: string }
      - { name: runId, type: string }
  - name: connector.webhook.failed
    level: ERROR
    message: webhook failed to apply
    description: A verified webhook could not be applied.
    throwable: true
    fields:
      - { name: connector, type: string }
      - { name: runId, type: string }

  # Sync runs (#29): one started and one finished per run, webhook runs included, and one line per
  # page applied. A run's failures have their own connector.* events above.
  - name: sync.started
    level: INFO
    message: sync run started
    description: A connector began a run, scheduled, manual or from a webhook.
    fields:
      - { name: connector, type: string }
      - { name: syncRunId, type: string }
      - { name: mode, type: string }
  - name: sync.page
    level: INFO
    message: sync page applied
    description: A page a connector read was written to the graph. Pages count from 1.
    fields:
      - { name: connector, type: string }
      - { name: syncRunId, type: string }
      - { name: page, type: int }
      - { name: nodes, type: int }
      - { name: edges, type: int }
  - name: sync.finished
    level: INFO
    message: sync run finished
    description: A run ended, with how it ended, how long it took and what it wrote.
    fields:
      - { name: connector, type: string }
      - { name: syncRunId, type: string }
      - { name: mode, type: string }
      - { name: status, type: string }
      - { name: durationMs, type: int }
      - { name: nodesUpserted, type: int }
      - { name: edgesUpserted, type: int }
      - { name: tombstones, type: int }
  - name: sync.runs.pruned
    level: INFO
    message: old sync runs pruned
    description: The retention job deleted the runs that finished before olderThan (#29, FR6). Logged even when it deleted none, so a quiet night still shows the job ran.
    fields:
      - { name: deleted, type: int }
      - { name: olderThan, type: instant }
  - name: sync.runs.prune.failed
    level: WARN
    message: pruning old sync runs failed
    description: The retention job could not finish; the runs it had not reached are pruned the next night.
    throwable: true
    fields:
      - { name: deleted, type: int }

  # GitHub
  - name: github.unreachable
    level: WARN
    message: GitHub is not reachable
    description: The GitHub health check could not reach GitHub.
    fields:
      - { name: reason, type: string }
  - name: github.retrying
    level: INFO
    message: GitHub request failed; retrying
    description: A GitHub request failed in a way worth retrying.
    fields:
      - { name: reason, type: string }
      - { name: attempt, type: int }
      - { name: maxAttempts, type: int }
  - name: github.rate.limited
    level: INFO
    message: waiting for the GitHub rate limit to reset
    description: GitHub's rate limit was reached; the connector waits for it rather than failing.
    fields:
      - { name: waitSeconds, type: int }
  - name: github.webhook.ignored
    level: DEBUG
    message: GitHub webhook ignored
    description: A GitHub webhook of a type the connector does not use.
    fields:
      - { name: eventType, type: string }
  - name: github.webhook.malformed
    level: WARN
    message: verified GitHub webhook was not JSON
    description: A GitHub webhook passed its signature check but its body could not be read.
    fields:
      - { name: reason, type: string }
  - name: github.dependencies.deferred
    level: DEBUG
    message: internal dependencies deferred
    description: Dependencies on repositories not yet known were deferred to a later sync.
    fields:
      - { name: count, type: int }
  - name: github.file.unreadable
    level: WARN
    message: could not read a file
    description: A manifest or IaC file could not be read; the repository is still recorded.
    fields:
      - { name: path, type: string }
      - { name: repository, type: string }
  - name: github.file.skipped
    level: INFO
    message: file skipped as too large
    description: A file was too large to read.
    fields:
      - { name: path, type: string }
      - { name: repository, type: string }
      - { name: bytes, type: int }

  # GitHub Actions and the Deployments API (#90)
  - name: actions.deployment.unattributed
    level: INFO
    message: deployment not recorded; no artifact it deployed is known
    description: A GitHub deployment was read whose run published no package version the connector could attribute to it, so there is no artifact to record it against.
    fields:
      - { name: repository, type: string }
      - { name: deploymentId, type: string }
  - name: actions.package.ambiguous
    level: INFO
    message: package version not attributed; more than one run could have published it
    description: A package version was published while two or more runs of its repository were running, so it is credited to none of them rather than to a guess.
    fields:
      - { name: repository, type: string }
      - { name: artifact, type: string }
  - name: actions.webhook.ignored
    level: DEBUG
    message: GitHub Actions webhook ignored
    description: A verified GitHub event the github-actions connector does not record, or one about an owner it was not configured to read.
    fields:
      - { name: eventType, type: string }
      - { name: reason, type: string }

  # ServiceNow
  - name: servicenow.unreachable
    level: WARN
    message: ServiceNow is not reachable
    description: The ServiceNow health check could not reach ServiceNow.
    fields:
      - { name: reason, type: string }
  - name: servicenow.health.refused
    level: WARN
    message: ServiceNow refused the health check
    description: ServiceNow answered the health check with a refusal, usually of the credentials.
    fields:
      - { name: reason, type: string }
  - name: servicenow.retrying
    level: INFO
    message: ServiceNow request failed; retrying
    description: A ServiceNow request failed in a way worth retrying.
    fields:
      - { name: reason, type: string }
      - { name: attempt, type: int }
      - { name: maxAttempts, type: int }
  - name: servicenow.remote.invalid
    level: INFO
    message: CI names something that is not a git remote
    description: A configuration item's repository field is not a git remote, so no link is written.
    fields:
      - { name: value, type: string }
      - { name: field, type: string }
      - { name: ci, type: string }
  - name: servicenow.link.unresolved
    level: INFO
    message: no repository for the CI's link
    description: A configuration item names a repository the graph does not hold, so no link is written.
    fields:
      - { name: repository, type: string }
