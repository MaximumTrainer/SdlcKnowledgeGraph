spring:
  application:
    name: repodatagraph
  # The API has no users of its own: callers are principals an identity provider vouched for (#114).
  # Without this Spring Boot would invent an in-memory user and log its generated password.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password}
  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /graphql

server:
  port: 8080

factstore:
  base-url: ${FACTSTORE_URL:http://localhost:8090}
  org-slug: ${FACTSTORE_ORG_SLUG:repodatagraph}
  api-key: ${FACTSTORE_API_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Each readable log line names the request it was written for (RequestIdFilter, #44). Under the
# docker profile the same id is a field of the JSON line instead (logback-spring.xml).
logging:
  pattern:
    correlation: "[%X{requestId:-}] "

# /actuator/prometheus is for a scraper inside the deployment; the web interface's nginx does not
# proxy it (docs/DEPLOYMENT.md, D9). Request durations are a histogram with a bucket at 500 ms, the
# latency objective the alert rules measure against (docs/OBSERVABILITY.md).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 500ms

# Whether a stale connector takes the instance out of readiness as well as turning the connectors
# health component DOWN (#29, FR4). Off: a stale graph still answers correctly about what it has, and
# failing readiness for it would take the instance out of service for something a restart cannot fix.
# FreshnessReadiness reads it before the health groups are built.
#
# Finished SyncRun nodes older than sync-run-retention are pruned nightly, on sync-run-retention-cron
# (#29, FR6). The nodes a pruned run produced stay, still naming it in their provenance.
observability:
  freshness-affects-readiness: ${FRESHNESS_AFFECTS_READINESS:false}
  sync-run-retention: ${SYNC_RUN_RETENTION:P30D}
  sync-run-retention-cron: ${SYNC_RUN_RETENTION_CRON:0 30 3 * * *}
  # How often sdlc_graph_nodes and sdlc_graph_edges are recounted (#29, FR1). A scrape reads the last
  # count rather than querying Neo4j, so this, not the scrape interval, is how stale they can be.
  graph-count-interval: ${GRAPH_COUNT_INTERVAL:PT5M}

# How long each source system's facts stay fresh once it has stated them (#93, docs/ONTOLOGY.md). A
# current fact older than its source's window is read back with provenance.stale true, and a source
# whose last successful sync is older than its window turns the freshness health component WARN -
# never DOWN, so it cannot fail a probe. A day unless a source is named under windows, by its name in
# sources.yaml: FRESHNESS_WINDOWS_AWS=PT6H, say. Published by GET /api/v1/ontology under freshness.
freshness:
  default-window: ${FRESHNESS_DEFAULT_WINDOW:PT24H}
  windows: {}

# Cloud-to-repository link resolution (#28, docs/ONTOLOGY.md). Each rule proposes owners at its
# confidence - manual 1.0, tag 0.95, deployment 0.9, iac 0.7, naming 0.4 - and the strongest at or
# above the threshold becomes an inferred OWNS_RESOURCE; below it, a CANDIDATE_LINK for review. A
# resolution runs nightly ("-" never), and after any run of a connector named in triggers, scoped to
# what that run wrote. Neither runs on a read-only instance.
links:
  threshold: ${LINKS_THRESHOLD:0.5}
  schedule: ${LINKS_SCHEDULE:0 0 3 * * *}
  triggers: ${LINKS_TRIGGERS:github,github-actions,aws,azure,gcp}
  rules:
    tag:
      keys: ${LINKS_TAG_KEYS:repo,repository,source-repo,git-repo}

# The data lifecycle (#33, docs/adr/0014-data-lifecycle.md). A node's changed values are kept as
# versions, at most max-versions per node, so a read as of an instant sees the values of that moment.
#
# The archive NEVER deletes anything unless an operator opts in twice: LIFECYCLE_ARCHIVE_ENABLED=true
# turns it on and schedules it, and on its own it only reports what it would take (dry-run). Only
# LIFECYCLE_ARCHIVE_MODE=export writes closed facts older than the retention to a JSONL file in
# directory, and only LIFECYCLE_ARCHIVE_MODE=purge also deletes them from the graph after writing them.
#
# Ontology migrations under ontology/migrations/ are applied as the application starts (auto); manual
# leaves them for an admin to apply from the lifecycle page. Neither ever fails a health probe.
lifecycle:
  versioning:
    enabled: ${LIFECYCLE_VERSIONING_ENABLED:true}
    max-versions: ${LIFECYCLE_VERSIONING_MAX_VERSIONS:50}
    exclude-types: []
  archive:
    enabled: ${LIFECYCLE_ARCHIVE_ENABLED:false}
    mode: ${LIFECYCLE_ARCHIVE_MODE:dry-run}
    retention: ${LIFECYCLE_ARCHIVE_RETENTION:P365D}
    schedule: ${LIFECYCLE_ARCHIVE_SCHEDULE:0 0 4 * * *}
    directory: ${LIFECYCLE_ARCHIVE_DIRECTORY:./archive}
  migrations:
    mode: ${LIFECYCLE_MIGRATIONS_MODE:auto}
    location: classpath:ontology/migrations/

# Ingestion from systems of record. Every connector is off until someone turns it on: a connector
# reaches a real system with real credentials, so being on the classpath must not be the same as
# being allowed to talk to anything (docs/ADAPTERS.md).
#
# Each connector is configured under connectors.settings.<name>: enabled, schedule, webhook-secret, and
# freshness-threshold (#29), how long after its last success it counts as stale. The threshold
# defaults to PT2H, or PT24H for a connector that takes webhooks.
connectors:
  settings: {}
  # Where the GitHub connector looks. From the environment rather than from here: a token is a
  # credential, and a credential in a file that is committed is a credential that has leaked.
  github:
    orgs: ${GITHUB_ORGS:}
    token: ${GITHUB_TOKEN:}
  # Where the ServiceNow connector looks, and as whom. From the environment for the same reason.
  servicenow:
    instance-url: ${SERVICENOW_URL:}
    auth:
      mode: ${SERVICENOW_AUTH_MODE:BASIC}
      username: ${SERVICENOW_USERNAME:}
      password: ${SERVICENOW_PASSWORD:}
      client-id: ${SERVICENOW_CLIENT_ID:}
      client-secret: ${SERVICENOW_CLIENT_SECRET:}

# Deployment posture (#48). Read-only refuses every write, deny-by-default, so an instance reachable
# by people who must not change it cannot be changed through it, whoever signs in - and an instance
# with no identity provider must be read-only (sdlc.auth below).
# The bearer token the deploy pipeline sends to POST /api/v1/ingest/deployment (#7). Unset turns the
# endpoint off (503) rather than leaving it open.
ingest:
  token: ${INGEST_TOKEN:}

sdlc:
  read-only: ${SDLC_READ_ONLY:false}
  # Who the API trusts to say who a caller is (#114, #118, docs/AUTH.md). With AUTH_ISSUER_URI, every
  # request under /api and /graphql needs a bearer JWT that issuer signed. Without it, the instance
  # runs the anonymous read-only mode - reads for anyone, every write refused, announced on every
  # start - which AuthGuard lets start only with SDLC_READ_ONLY=true (#48 FR6). There is no bypass:
  # AUTH_DISABLED was removed, and setting it stops the API starting.
  # AUTH_JWK_SET_URI is only for an API that reaches the issuer at another address than it signs as.
  auth:
    issuer-uri: ${AUTH_ISSUER_URI:}
    jwk-set-uri: ${AUTH_JWK_SET_URI:}
  # Reported on /actuator/info. The image build stamps the commit it was built from (backend/Dockerfile),
  # so a pipeline can ask the running instance whether it is serving the commit it meant to deploy.
  deployment:
    commit: ${SDLC_COMMIT:}
