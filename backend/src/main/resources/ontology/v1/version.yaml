# Ontology version, semver.
#
# Adding a type or an optional property is a patch or minor change and needs nothing else. Renaming
# or removing anything requires a migration script and a major bump, because data already in the
# graph refers to the old names. The version in force is recorded on an (:Ontology) node so a graph
# can be checked against the code that is reading it.
# 1.1.0 (#85) added Change, PullRequest and ExternalWorkItem and the edges between them: a minor
# bump, since nothing was renamed or removed. A build older than this refuses to start against a
# graph it has recorded, so rolling back past it means rolling the graph back too.
# 1.2.0 (#88) added Repository's provider and providerId, the alias they form, and previousKeys on
# the provenance envelope: a minor bump for the same reason, and the same rollback caveat.
# 1.3.0 (#81) made the registry self-describing: examples, formats and deprecations on properties,
# example nodes and questions on types, and enums on the status-like properties, enforced on write.
# A minor bump: nothing was renamed or removed, and data written before an enum still reads. The
# deprecated properties stay, and go only in a major version with a migration (#33).
# 1.4.0 (#33) added the data lifecycle's meta types: NodeVersion, the values a node held before a
# write replaced them, and OntologyMigration, each versioned migration the graph has had. A minor
# bump: nothing was renamed or removed. From here a rename or removal ships with a migration under
# ontology/migrations/, applied as the application starts (docs/ONTOLOGY.md).
# 1.5.0 (#98) hardened identity for real estates: environments.yaml, the environment alias table
# IdentityResolver used to hold; mergeScope on node types; Artifact's derived identityQuality; the
# PROVIDES path of a monorepo's service; and merged among NodeVersion's retired reasons. A minor
# bump: nothing was renamed or removed, and no data needs a migration, since identityQuality is
# derived again on every write and a node written before it still reads.
# 1.6.0 (#96) added templates.yaml, the traversal templates of context packs, and let DEPENDS_ON reach
# a CloudResource, so a repository reading a data store (kind: data) is one edge from it. A minor
# bump: nothing was renamed or removed, and no data needs a migration.
# 1.7.0 (#86) added Repository's forkOf, and on SyncRun the written, unchanged and failed counts and
# the connectorVersion that ran. A minor bump: nothing was renamed or removed, and no data needs a
# migration, since a run recorded before them reads them as unknown.
# 1.8.0 (#90) added superseded among NodeVersion's retired reasons: a deployment a newer deployment of
# the same artifact family to the same environment replaced. A minor bump: nothing was renamed or
# removed, and no data needs a migration.
version: 1.8.0
