# Relationship types. See docs/ONTOLOGY.md.
#
# Every edge declares an `inverse`: the name used when traversing it backwards. The inverse is a
# traversal concept, not a second stored edge, so "what does this depend on" and "what depends on
# this" are one relationship read in two directions. An edge without an inverse fails startup.
#
# `impact: propagates` marks an edge a change travels along (#21): the blast radius walks exactly these
# edges and no query names them. `downstream` says which way the change travels - `forward`, the
# default, as the edge is stored, or `inverse`, against it. `DEPENDS_ON` points from the dependent to
# what it depends on, and a change travels from the second to the first, so its downstream is
# `DEPENDED_ON_BY`. An upstream walk reads every propagating edge the other way.
#
# `ownership: owner` marks an edge that names an owner. `ownership: inherits` passes ownership on
# against the direction a change travels: a thing with no owner of its own is owned by whoever owns
# what its changes come from. Only a propagating edge can inherit, since only it has that direction.
#
# An edge's properties describe themselves like a node's (#81; nodes.yaml): a description and an
# example each, and an enum where the values are closed. `ontologyLint` holds them to it.

edges:
  OWNED_BY:
    description: Ownership of a repository, service or cloud resource by a team.
    from: [Repository, Service, CloudResource]
    to: [Team]
    inverse: OWNS
    ownership: owner
    properties:
      # What the claim rests on. A CODEOWNERS line names a team against a path, and "owns everything"
      # and "owns /docs/" are both recorded as ownership - only the pattern says which was declared.
      - { name: pathPatterns, type: "string[]", required: false, description: "CODEOWNERS patterns the owner was named against, where ownership came from a file", examples: [["*", "/docs/"]] }

  OWNS_RESOURCE:
    description: A repository or service is responsible for a piece of infrastructure.
    from: [Repository, Service]
    to: [CloudResource]
    inverse: OWNED_BY_REPO
    impact: propagates
    ownership: inherits
    properties:
      - { name: rule, type: string, required: false, description: "What the ownership rests on: stated by hand, or the link rule that proposed it", enum: [manual, tag, deployment, iac, naming], examples: [tag] }
      - { name: evidence, type: "string[]", required: false, description: "What the rule found, as key=value entries, so the ownership can be explained", examples: [["tag=repo"]] }
      - { name: resolvedAt, type: instant, required: false, description: "When the link engine last found the evidence for this ownership", examples: ["2026-09-30T12:00:00Z"] }
      - { name: acceptedBy, type: string, required: false, description: "Who accepted the candidate link or stated the ownership by hand", examples: [dan] }
      - { name: acceptedAt, type: instant, required: false, description: "When the candidate link was accepted or the ownership stated by hand", examples: ["2026-09-30T12:00:00Z"] }

  CANDIDATE_LINK:
    description: A link rule proposes a repository as the owner, too weakly to say so.
    from: [CloudResource]
    to: [Repository]
    inverse: MAY_OWN
    impact: none
    ownership: none
    properties:
      - { name: candidateId, type: string, required: true, description: "Stable id of the candidate, derived from the resource and repository keys", examples: [3f9a0c1d2b4e5f60] }
      - { name: status, type: string, required: true, description: "Where the candidate stands in review: open, decided, or replaced by another decision", enum: [pending, conflict, rejected, superseded, accepted], examples: [pending] }
      - { name: rule, type: string, required: true, description: "The link rule whose evidence is strongest for this pair", enum: [tag, deployment, iac, naming], examples: [naming] }
      - { name: evidence, type: "string[]", required: false, description: "What the rule found, as key=value entries, for the reviewer to weigh", examples: [["name=billing-prod"]] }
      - { name: evidenceHash, type: string, required: true, description: "Hash of the rule and its evidence; a rejection holds until the evidence changes", examples: [0123456789abcdef] }
      - { name: createdAt, type: instant, required: true, description: "When the link engine first proposed this candidate", examples: ["2026-09-30T12:00:00Z"] }
      - { name: rejectedBy, type: string, required: false, description: "Who rejected the candidate, which then stays rejected", examples: [dan] }
      - { name: rejectedAt, type: instant, required: false, description: "When the candidate was rejected by a reviewer", examples: ["2026-09-30T12:00:00Z"] }

  DEPENDS_ON:
    description: A dependency between repositories, services or third-party libraries, or on a data store.
    from: [Repository, Service, ConfigurationItem]
    to: [Repository, Service, Library, ConfigurationItem, CloudResource]
    inverse: DEPENDED_ON_BY
    impact: propagates
    downstream: inverse
    properties:
      - name: kind
        type: string
        required: true
        description: "What sort of dependency this is"
        enum: [library, api, event, data, cmdb]
        examples: [library]
      - { name: manifest, type: string, required: false, description: "File the dependency was read from, with its path from the repository root in a monorepo", examples: [frontend/package.json, services/billing/build.gradle.kts] }
      - { name: version, type: string, required: false, description: "The version the manifest asks for, as written", examples: [^3.5.0] }
      - { name: scope, type: string, required: false, description: "Whether the dependency is needed to run or only to build", enum: [runtime, dev], examples: [runtime] }
      - { name: relType, type: string, required: false, description: "The source system's own name for the relationship, e.g. a CMDB's 'Depends on::Used by'", examples: ["Depends on::Used by"] }

  CONTAINS_IAC:
    description: A repository holds an infrastructure-as-code file.
    from: [Repository]
    to: [IacFile]
    inverse: IAC_IN

  HAS_PIPELINE:
    description: A repository defines a CI/CD pipeline.
    from: [Repository]
    to: [Pipeline]
    inverse: PIPELINE_OF
    impact: propagates
    ownership: inherits

  RELATES_TO_CI:
    description: A repository or service corresponds to a configuration item in service management.
    from: [Repository, Service]
    to: [ConfigurationItem]
    inverse: CI_OF

  # What a change or an incident was about. One name for both, because the question asked of them is
  # the same one - "what else is touching this thing" - and two names would mean every traversal that
  # wanted the answer had to know which kind it was looking at first.
  AFFECTS:
    description: A change or an incident concerns a configuration item, service or repository.
    from: [ChangeRequest, Incident]
    to: [ConfigurationItem, Service, Repository]
    inverse: AFFECTED_BY

  CAUSED_BY:
    description: An incident is attributed to a change.
    from: [Incident]
    to: [ChangeRequest, Deployment]
    inverse: CAUSED

  BUILT_FROM:
    description: An artifact was built from a repository at a particular commit.
    from: [Artifact]
    to: [Repository]
    inverse: BUILDS
    impact: propagates
    # A change to the repository reaches what is built from it: downstream is BUILDS.
    downstream: inverse
    ownership: inherits
    properties:
      - { name: commitSha, type: string, required: false, description: "The commit the artifact was built from", examples: [9fceb02d0ae598e95dc970b74767f19372d61af8] }

  DEPLOYED_TO:
    description: An artifact was the subject of a deployment.
    from: [Artifact]
    to: [Deployment]
    inverse: DEPLOYMENT_OF
    impact: propagates
    ownership: inherits

  TO_ENVIRONMENT:
    description: A deployment targeted an environment.
    from: [Deployment]
    to: [Environment]
    inverse: HOSTS
    impact: propagates

  PROVIDES:
    description: A repository provides a running service.
    from: [Repository]
    to: [Service]
    inverse: PROVIDED_BY
    impact: propagates
    ownership: inherits
    # A monorepo provides several services, each from a directory of its own (#98), so the edge says
    # which: a change under that path is a change to that service.
    properties:
      - { name: path, type: string, required: false, description: "The directory the service is built from, relative to the repository root; absent for the whole repository", examples: [services/billing] }

  # A change and the intent behind it (#85). CONTAINS is the join both lineage questions cross:
  # "where is this work item live" walks IMPLEMENTS back to its changes, CONTAINS back to the
  # artifacts that hold them and DEPLOYED_TO on to deployments; "what did this deployment carry"
  # walks the same edges the other way.
  INTRODUCED_IN:
    description: A change was made in a repository.
    from: [Change]
    to: [Repository]
    inverse: HAS_CHANGE

  MERGES:
    description: A pull request merged a change.
    from: [PullRequest]
    to: [Change]
    inverse: MERGED_BY

  CONTAINS:
    description: An artifact was built with a change in it.
    from: [Artifact]
    to: [Change]
    inverse: CONTAINED_IN
    impact: propagates
    # A change reaches the artifacts that contain it, and from them their deployments: downstream is
    # CONTAINED_IN. So the blast radius of a Change answers "what depends on this change".
    downstream: inverse

  IMPLEMENTS:
    description: A change implements a work item in the system that owns it.
    from: [Change]
    to: [ExternalWorkItem]
    inverse: IMPLEMENTED_BY

  TRACKED_IN:
    description: A work item is tracked by a team.
    from: [ExternalWorkItem]
    to: [Team]
    inverse: TRACKS

  # Which run asserted a fact. Provenance already records the run id on every node, but an edge makes
  # it traversable: "show me everything that run wrote" is then one hop rather than a property scan,
  # which is what makes a bad sync reversible rather than merely auditable.
  PRODUCED:
    description: A sync run asserted this node.
    from: [SyncRun]
    # Every type a connector can write. A type missing from here is one a run cannot record having
    # written, which fails the page rather than losing it quietly - so this list grows with the
    # others above it.
    to: [Repository, Team, Service, Pipeline, Artifact, Deployment, Environment, CloudResource, ConfigurationItem, Library, IacFile, ChangeRequest, Incident, Change, PullRequest, ExternalWorkItem]
    inverse: PRODUCED_BY
