# Relationship types. See docs/ONTOLOGY.md.
#
# Every edge declares an `inverse`: the name used when traversing it backwards. The inverse is a
# traversal concept, not a second stored edge, so "what does this depend on" and "what depends on
# this" are one relationship read in two directions. An edge without an inverse fails startup.
#
# `impact: propagates` marks an edge a change travels along (#21): the blast radius walks exactly these
# edges and no query names them. `downstream` says which way the change travels - `forward`, the
# default, as the edge is stored, or `inverse`, against it. `DEPENDS_ON` points from the dependent to
# what it depends on, and a change travels from the second to the first, so its downstream is
# `DEPENDED_ON_BY`. An upstream walk reads every propagating edge the other way.
#
# `ownership: owner` marks an edge that names an owner. `ownership: inherits` passes ownership on
# against the direction a change travels: a thing with no owner of its own is owned by whoever owns
# what its changes come from. Only a propagating edge can inherit, since only it has that direction.

edges:
  OWNED_BY:
    description: Ownership of a repository, service or cloud resource by a team.
    from: [Repository, Service, CloudResource]
    to: [Team]
    inverse: OWNS
    ownership: owner
    properties:
      # What the claim rests on. A CODEOWNERS line names a team against a path, and "owns everything"
      # and "owns /docs/" are both recorded as ownership - only the pattern says which was declared.
      - { name: pathPatterns, type: "string[]", required: false, description: "CODEOWNERS patterns the owner was named against, where ownership came from a file" }

  OWNS_RESOURCE:
    description: A repository or service is responsible for a piece of infrastructure.
    from: [Repository, Service]
    to: [CloudResource]
    inverse: OWNED_BY_REPO
    impact: propagates
    ownership: inherits
    properties:
      - { name: rule, type: string, required: false, description: "Which link rule proposed this, e.g. tag or iac" }

  DEPENDS_ON:
    description: A dependency between repositories, services or third-party libraries.
    from: [Repository, Service, ConfigurationItem]
    to: [Repository, Service, Library, ConfigurationItem]
    inverse: DEPENDED_ON_BY
    impact: propagates
    downstream: inverse
    properties:
      - name: kind
        type: string
        required: true
        description: "What sort of dependency this is"
        enum: [library, api, event, data, cmdb]
      - { name: manifest, type: string, required: false, description: "File the dependency was read from, e.g. build.gradle.kts" }
      - { name: version, type: string, required: false, description: "The version the manifest asks for, as written" }
      - { name: scope, type: string, required: false, description: "Whether the dependency is needed to run or only to build", enum: [runtime, dev] }
      - { name: relType, type: string, required: false, description: "The source system's own name for the relationship, e.g. a CMDB's 'Depends on::Used by'" }

  CONTAINS_IAC:
    description: A repository holds an infrastructure-as-code file.
    from: [Repository]
    to: [IacFile]
    inverse: IAC_IN

  HAS_PIPELINE:
    description: A repository defines a CI/CD pipeline.
    from: [Repository]
    to: [Pipeline]
    inverse: PIPELINE_OF
    impact: propagates
    ownership: inherits

  RELATES_TO_CI:
    description: A repository or service corresponds to a configuration item in service management.
    from: [Repository, Service]
    to: [ConfigurationItem]
    inverse: CI_OF

  # What a change or an incident was about. One name for both, because the question asked of them is
  # the same one - "what else is touching this thing" - and two names would mean every traversal that
  # wanted the answer had to know which kind it was looking at first.
  AFFECTS:
    description: A change or an incident concerns a configuration item, service or repository.
    from: [ChangeRequest, Incident]
    to: [ConfigurationItem, Service, Repository]
    inverse: AFFECTED_BY

  CAUSED_BY:
    description: An incident is attributed to a change.
    from: [Incident]
    to: [ChangeRequest, Deployment]
    inverse: CAUSED

  BUILT_FROM:
    description: An artifact was built from a repository at a particular commit.
    from: [Artifact]
    to: [Repository]
    inverse: BUILDS
    impact: propagates
    # A change to the repository reaches what is built from it: downstream is BUILDS.
    downstream: inverse
    ownership: inherits
    properties:
      - { name: commitSha, type: string, required: false }

  DEPLOYED_TO:
    description: An artifact was the subject of a deployment.
    from: [Artifact]
    to: [Deployment]
    inverse: DEPLOYMENT_OF
    impact: propagates
    ownership: inherits

  TO_ENVIRONMENT:
    description: A deployment targeted an environment.
    from: [Deployment]
    to: [Environment]
    inverse: HOSTS
    impact: propagates

  PROVIDES:
    description: A repository provides a running service.
    from: [Repository]
    to: [Service]
    inverse: PROVIDED_BY
    impact: propagates
    ownership: inherits

  # Which run asserted a fact. Provenance already records the run id on every node, but an edge makes
  # it traversable: "show me everything that run wrote" is then one hop rather than a property scan,
  # which is what makes a bad sync reversible rather than merely auditable.
  PRODUCED:
    description: A sync run asserted this node.
    from: [SyncRun]
    # Every type a connector can write. A type missing from here is one a run cannot record having
    # written, which fails the page rather than losing it quietly - so this list grows with the
    # others above it.
    to: [Repository, Team, Service, Pipeline, Artifact, Deployment, Environment, CloudResource, ConfigurationItem, Library, IacFile, ChangeRequest, Incident]
    inverse: PRODUCED_BY
