# Node types in the SDLC knowledge graph. See docs/ONTOLOGY.md.
#
# `identity` names the properties whose values form the node's key, so the same real-world thing
# reported by two connectors lands on one node. `required` is enforced on write and is also checked
# against the typed Kotlin classes at startup: a required property here must exist on the class of
# the same name. Properties marked optional may exist only in the registry, which is how the target
# identity model is declared before #19 migrates the Kotlin classes onto it.
#
# `meta: true` marks a type that describes the graph itself rather than the software it models. The
# web interface leaves meta types out of its navigation; they are still stored and queryable.
#
# `displayProperty` names the property a node is labelled with where it is drawn, such as the graph
# view (#9): a repository reads as `payments` rather than `github.com/acme/payments`. It must be a
# property the type declares; a node without a value for it is labelled with its key.

nodes:
  Repository:
    description: A git repository, the anchor for most of the graph.
    identity: [host, org, name]
    # The provider's own id for the repository (#88), which survives a rename or a transfer between
    # organisations where the remote does not. An alias rather than part of the key: unique where
    # present, enforced by a constraint, and consulted before the key, so a write carrying it moves
    # the node that holds it instead of creating a second one.
    alias: [provider, providerId]
    displayProperty: name
    properties:
      - { name: url, type: string, required: true, description: "The git remote, in any form; stored canonicalised as https://host/org/name" }
      # Not required of a caller: the server derives all three from url before anything is validated
      # or stored. They are the identity, so an editing screen shows them but cannot change them.
      - { name: host, type: string, required: false, description: "Host of the remote, e.g. github.com. Derived from url" }
      - { name: org, type: string, required: false, description: "Owning organisation or user. Derived from url" }
      - { name: name, type: string, required: false, description: "Repository name. Derived from url" }
      - { name: defaultBranch, type: string, required: true }
      - { name: topics, type: "string[]", required: true }
      - { name: codeowners, type: "string[]", required: true }
      - { name: serviceId, type: string, required: false }
      - { name: language, type: string, required: false }
      - { name: description, type: string, required: false }
      - { name: visibility, type: string, required: false, description: "public, private or internal, as the forge reports it", enum: [public, private, internal] }
      # What this repository publishes, so a dependency naming one of them resolves to it rather than
      # to a third-party Library with the same name.
      - { name: packageNames, type: "string[]", required: false, description: "Package names this repository publishes" }
      # Derived from the host when absent and the host is github.com or gitlab.com.
      - { name: provider, type: string, required: false, description: "Who assigns providerId. Derived from url on github.com and gitlab.com", enum: [github, gitlab, other] }
      - { name: providerId, type: string, required: false, description: "The provider's stable id for the repository, such as GitHub's numeric repository id" }

  Team:
    description: A group that owns repositories, services or infrastructure.
    identity: [name]
    displayProperty: name
    properties:
      - { name: name, type: string, required: true }
      - { name: email, type: string, required: false }

  Service:
    description: A running logical component, which may span more than one repository.
    identity: [name]
    displayProperty: name
    properties:
      - { name: name, type: string, required: true }
      - { name: description, type: string, required: false }
      - { name: tier, type: string, required: false, description: "Criticality tier, e.g. gold" }

  Pipeline:
    description: A CI/CD workflow definition.
    identity: [provider, repoKey, workflowPath]
    displayProperty: name
    properties:
      - { name: provider, type: string, required: true, description: "e.g. github-actions" }
      - { name: repoKey, type: string, required: false, description: "Key of the repository holding the workflow" }
      - { name: workflowPath, type: string, required: false, description: "Path of the workflow file" }
      - { name: name, type: string, required: true }
      - { name: repoId, type: string, required: true }
      - { name: lastRunStatus, type: string, required: false }

  Artifact:
    description: A built, addressable output such as a container image.
    identity: [registry, name, digest]
    displayProperty: name
    properties:
      - { name: registry, type: string, required: false, description: "e.g. ghcr.io" }
      - { name: name, type: string, required: true }
      - { name: digest, type: string, required: false, description: "Immutable content digest, preferred for identity" }
      - { name: version, type: string, required: true }
      - { name: commitSha, type: string, required: false }
      - { name: repoId, type: string, required: false }
      - { name: artifactType, type: string, required: true }

  Deployment:
    description: One event of putting an artifact into an environment.
    identity: [artifactKey, environmentKey, deployedAt]
    displayProperty: deployedAt
    properties:
      - { name: artifactKey, type: string, required: false }
      - { name: environmentKey, type: string, required: false }
      - { name: deployedAt, type: instant, required: true }
      - { name: artifactId, type: string, required: true }
      - { name: environmentId, type: string, required: true }
      - { name: deployedBy, type: string, required: false }
      - { name: status, type: string, required: true }

  Environment:
    description: A deployment target such as staging or production.
    identity: [name]
    displayProperty: name
    properties:
      - { name: name, type: string, required: true }
      - { name: type, type: string, required: true }
      # How much a change reaching this environment matters (#87): impact analysis weights a hit by
      # it. Optional rather than required with a default, because there is no migration mechanism to
      # set it on environments already in the graph (#33); a missing tier is read as `other`, never
      # guessed from the name.
      - { name: tier, type: string, required: false, description: "Criticality, for ranking impact; read as other where absent", enum: [production, pre_production, development, other] }

  CloudResource:
    description: An infrastructure object in AWS, Azure or GCP.
    identity: [provider, resourceId]
    displayProperty: name
    properties:
      - { name: provider, type: string, required: true, description: "aws, azure or gcp" }
      - { name: resourceId, type: string, required: false, description: "ARN, Azure resource id or GCP asset name" }
      - { name: resourceType, type: string, required: true }
      - { name: name, type: string, required: true }
      - { name: region, type: string, required: false }
      - { name: accountId, type: string, required: false }
      - { name: repoId, type: string, required: false }

  ConfigurationItem:
    description: A configuration item from a service management system such as ServiceNow.
    identity: [sourceSystem, instance, sysId]
    displayProperty: ciName
    properties:
      - { name: sourceSystem, type: string, required: true, description: "e.g. servicenow" }
      - { name: instance, type: string, required: true, description: "Instance the CI belongs to" }
      - { name: sysId, type: string, required: true, description: "Identifier in the source system" }
      - { name: ciName, type: string, required: true }
      - { name: ciClass, type: string, required: false, description: "e.g. cmdb_ci_service" }
      - { name: serviceId, type: string, required: false }
      # What a CMDB is consulted for. Criticality and support group are the fields somebody actually
      # reads at three in the morning, and a graph that has the CI but not these sends them back to
      # the CMDB to look them up - which is the trip this graph exists to save.
      - { name: operationalStatus, type: string, required: false, description: "As the CMDB reports it, e.g. Operational or Retired" }
      - { name: environment, type: string, required: false }
      - { name: businessCriticality, type: string, required: false, description: "e.g. 1 - most critical" }
      - { name: ownerGroup, type: string, required: false }
      - { name: supportGroup, type: string, required: false }
      - { name: number, type: string, required: false, description: "The human-facing identifier, where the CI has one" }

  # A planned change, as the service-management tool records it. Not a deployment: a change request is
  # somebody's intention and its approval, and whether it actually reached production is a fact the
  # CI/CD connector reports. Keeping them apart is what lets "was this outage a change we approved"
  # be asked at all.
  ChangeRequest:
    description: A change as a service-management tool records it, with its approval and window.
    identity: [sourceSystem, instance, sysId]
    displayProperty: number
    properties:
      - { name: sourceSystem, type: string, required: true, description: "e.g. servicenow" }
      - { name: instance, type: string, required: true }
      - { name: sysId, type: string, required: true }
      - { name: number, type: string, required: true, description: "The human-facing identifier, e.g. CHG0001" }
      - { name: shortDescription, type: string, required: false }
      - { name: state, type: string, required: false, description: "As the tool reports it, e.g. Implement or Closed" }
      - { name: changeType, type: string, required: false, enum: [standard, normal, emergency] }
      - { name: risk, type: string, required: false }
      - { name: startDate, type: instant, required: false, description: "Start of the planned window" }
      - { name: endDate, type: instant, required: false, description: "End of the planned window" }
      - { name: closeCode, type: string, required: false }
      - { name: requestedBy, type: string, required: false }
      - { name: assignmentGroup, type: string, required: false }

  Incident:
    description: An operational failure as a service-management tool records it.
    identity: [sourceSystem, instance, sysId]
    displayProperty: number
    properties:
      - { name: sourceSystem, type: string, required: true, description: "e.g. servicenow" }
      - { name: instance, type: string, required: true }
      - { name: sysId, type: string, required: true }
      - { name: number, type: string, required: true, description: "The human-facing identifier, e.g. INC0001" }
      - { name: shortDescription, type: string, required: false }
      - { name: state, type: string, required: false }
      - { name: priority, type: string, required: false }
      - { name: severity, type: string, required: false }
      - { name: openedAt, type: instant, required: false }
      - { name: resolvedAt, type: instant, required: false }
      - { name: closeCode, type: string, required: false }
      - { name: assignmentGroup, type: string, required: false }

  Library:
    description: A third-party package a repository depends on, as its ecosystem names it.
    # Keyed by ecosystem as well as name, because "utils" on npm and "utils" on PyPI are different
    # packages and a shared key would merge two unrelated dependencies into one node.
    identity: [ecosystem, name]
    displayProperty: name
    properties:
      - { name: ecosystem, type: string, required: true, description: "npm, maven, pypi, go or gradle", enum: [npm, maven, pypi, go] }
      - { name: name, type: string, required: true, description: "The package name as the manifest spells it" }
      - { name: description, type: string, required: false }

  IacFile:
    description: An infrastructure-as-code file, and the resources it names.
    # Not the resources themselves. A CloudResource is something that exists; this is a file that
    # claims one should. Turning the claim into a link is the job of the link engine (#28).
    identity: [repoKey, path]
    displayProperty: path
    properties:
      - { name: repoKey, type: string, required: true, description: "Key of the repository holding the file" }
      - { name: path, type: string, required: true, description: "Path within the default branch" }
      - { name: format, type: string, required: true, enum: [terraform, cdk, bicep, cloudformation] }
      - { name: resourceRefs, type: "string[]", required: false, description: "Identifiers the file names literally, for the link engine to match on" }

  # A change and the intent behind it (#85). A Change is a commit range or merge in a repository; a
  # PullRequest proposed and merged it; an ExternalWorkItem is the task, ticket or issue that asked
  # for it. Together with an Artifact that CONTAINS the change they answer "where is this work item
  # live" and "what did this deployment carry", which is the join between intent and operations.
  Change:
    description: A commit range or merge in a repository, identified there by its head sha.
    # Keyed inside its repository: the same sha in a fork is a different change to a different
    # repository. The repository is named by its key, and the server stores it in that form whatever
    # remote notation the caller used, so a change lands beside the Repository node it belongs to.
    identity: [repositoryKey, sha]
    displayProperty: sha
    properties:
      - { name: repositoryKey, type: string, required: true, description: "Key of the repository the change was made in, e.g. github.com/acme/payments" }
      - { name: sha, type: string, required: true, description: "The commit the change ends at, stored in lower case" }
      - { name: baseSha, type: string, required: false, description: "The commit the change starts from, for a range" }
      - { name: title, type: string, required: false }
      - { name: author, type: string, required: false }
      - { name: committedAt, type: instant, required: true }
      - { name: url, type: string, required: false, description: "Where the change can be read, e.g. the commit or compare page" }

  PullRequest:
    description: A proposal to merge a change into a repository, as the forge records it.
    identity: [repositoryKey, number]
    displayProperty: number
    properties:
      - { name: repositoryKey, type: string, required: true, description: "Key of the repository the pull request targets" }
      - { name: number, type: int, required: true, description: "The forge's number for it within the repository" }
      - { name: url, type: string, required: true }
      - { name: title, type: string, required: false }
      - { name: state, type: string, required: false, enum: [open, merged, closed] }
      - { name: mergedAt, type: instant, required: false }
      - { name: branch, type: string, required: false, description: "The head branch, e.g. chorus/CH-42-retry-webhook" }

  # A reference, not a copy (ADR-0012): the description, acceptance criteria and decisions of a work
  # item stay authoritative in the system that owns it. The graph holds its URI and enough to show it.
  ExternalWorkItem:
    description: A task, ticket or issue in the system that owns it, referred to by its URI.
    # The URI exactly as the owning system writes it. Opaque: not lowercased, not parsed, not
    # normalised, because only that system knows which parts of it are case-sensitive.
    identity: [uri]
    displayProperty: externalKey
    properties:
      - { name: uri, type: string, required: true, description: "e.g. chorus://task/01J... or https://acme.atlassian.net/browse/PAY-42" }
      - { name: system, type: string, required: true, description: "The system that owns the work item", enum: [chorus, jira, linear, github, other] }
      # Not `key`: every node already has one, its identity, which this is not.
      - { name: externalKey, type: string, required: false, description: "Its human-facing identifier there, e.g. CH-42" }
      - { name: title, type: string, required: false }

  # Meta types: these describe the graph itself rather than the software it models.
  Ontology:
    description: Records which ontology version the graph was built with.
    meta: true
    identity: [version]
    displayProperty: version
    properties:
      - { name: version, type: string, required: true }
      - { name: loadedAt, type: instant, required: false }

  SyncRun:
    description: One execution of a connector, for auditing what a sync changed.
    meta: true
    identity: [id]
    displayProperty: id
    properties:
      - { name: id, type: string, required: true }
      - { name: connector, type: string, required: true }
      - { name: sourceSystem, type: string, required: false, description: "What this run stamped on the provenance of everything it wrote" }
      - { name: mode, type: string, required: false, description: "FULL, INCREMENTAL or WEBHOOK" }
      # The event that caused this run, as the source system numbered it. Present only for a webhook,
      # and the reason a redelivery is recognised rather than applied a second time.
      - { name: sourceId, type: string, required: false, description: "The source system's id for the delivery that caused this run" }
      - { name: startedAt, type: instant, required: false }
      - { name: finishedAt, type: instant, required: false }
      - { name: status, type: string, required: false, description: "RUNNING, SUCCESS, PARTIAL or FAILED" }
      - { name: nodesUpserted, type: int, required: false }
      - { name: edgesUpserted, type: int, required: false }
      - { name: tombstones, type: int, required: false, description: "Facts this run closed because the source stopped reporting them" }
      - { name: watermark, type: instant, required: false, description: "Where the next incremental run should start" }
      - { name: error, type: string, required: false }

  # Where the last successful run got to, per connector. Separate from SyncRun because a watermark
  # has to survive the runs that produced it: reading it back from the newest successful run would
  # mean a pruned history silently restarts every connector from the beginning.
  ConnectorState:
    description: What the graph remembers about a connector between runs.
    meta: true
    identity: [connector]
    displayProperty: connector
    properties:
      - { name: connector, type: string, required: true }
      - { name: watermark, type: instant, required: false, description: "Reported by the last successful run" }
      - { name: lastRunId, type: string, required: false, description: "The last scheduled or manual run to finish, whatever its status" }
      - { name: lastStatus, type: string, required: false, description: "That run's status; the same as lastRunStatus, kept for states written before it" }
      - { name: lastRunStatus, type: string, required: false, description: "SUCCESS, PARTIAL or FAILED" }
      - { name: lastFinishedAt, type: instant, required: false }
      # Freshness counts from here (#29). Only a SUCCESS moves it; a PARTIAL run read part of the
      # estate and cannot vouch for the rest.
      - { name: lastSuccessAt, type: instant, required: false, description: "When the last successful run finished" }
      - { name: consecutiveFailures, type: int, required: false, description: "Runs that ended PARTIAL or FAILED since the last SUCCESS" }

  # A connector or an agent the graph knows as a principal of its own (#115, ADR-0005). Written only
  # through /api/v1/service-principals, which only a user may call; the generic node API refuses it.
  # Who registered it and for how long it held are its provenance: writtenBy, validFrom and validTo.
  ServicePrincipal:
    description: A connector or agent registered as a principal of its own, owned by a team.
    meta: true
    identity: [name]
    displayProperty: name
    properties:
      - { name: name, type: string, required: true, description: "The client id its tokens carry (azp, or client_id)" }
      - { name: ownedBy, type: string, required: true, description: "Key of the Team that answers for it; recorded on its writes as onBehalfOfTeam" }
      - { name: description, type: string, required: false }
