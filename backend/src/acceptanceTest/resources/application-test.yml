# Active in acceptance tests (@ActiveProfiles("test")). Neo4j connection details come from Testcontainers.
management:
  endpoint:
    health:
      show-components: always
      show-details: always
      # The liveness and readiness groups, as the docker profile has them, so connector-freshness can
      # prove that a stale connector leaves the readiness probe alone.
      probes:
        enabled: true

# What the image build would stamp from the commit it was built from (SDLC_COMMIT). Fixed here so the
# deployment-info scenario can assert its shape without a git checkout.
sdlc:
  deployment:
    commit: 0123456789abcdef0123456789abcdef01234567

# The bearer token the deploy pipeline sends to POST /api/v1/ingest/deployment (#7).
ingest:
  token: test-ingest-token # not-a-secret: a fixture for the deployment-ingest feature

# The scripted connector the connector-sync feature drives. Enabled here and nowhere else: the point
# of connectors being off by default is that being on the classpath is not consent to run.
connectors:
  settings:
    fake:
      enabled: true
      # Far enough away that the scheduler never fires during a run, so what the scenarios observe is
      # what they asked for rather than a scheduled sync arriving in the middle.
      schedule: "0 0 5 31 2 ?"
      webhook-secret: fake-secret
      # Shorter than the webhook default of a day, so a success three hours old is stale (#29).
      freshness-threshold: PT1H
    github:
      enabled: true
      schedule: "0 0 5 31 2 ?"
      webhook-secret: github-secret
    servicenow:
      enabled: true
      schedule: "0 0 5 31 2 ?"
    # A second scripted connector with lifecycle rules of its own (#33): what a full sync stops
    # reporting is retired only once it has gone unreported for seven days, as an ITSM connector's is.
    fake-itsm:
      enabled: true
      schedule: "0 0 5 31 2 ?"
      lifecycle:
        missing-from-full-sync: tombstone
        grace-period: P7D
  # The org the fake serves. The base URL is set from the fake's port in CucumberSpringConfig, so
  # nothing here reaches the real api.github.com.
  github:
    orgs: [acme]
    token: fake-token
    manifests:
      # What the fake GitHub publishes under, so an internal dependency can be told from a library.
      internal-package-prefixes: ["@acme/", "com.acme"]
  # The fake ServiceNow's instance. The URL is set from the fake's port in CucumberSpringConfig.
  servicenow:
    # Named rather than derived from the fake's localhost URL, because the key an assertion names has
    # to be stable whatever port the fake happens to get.
    instance-name: sn.example.test
    auth:
      mode: BASIC
      username: integration
      password: fake-password
    # Small on purpose: crossing a page boundary is what pagination has to prove, and proving it with
    # five hundred rows a page costs minutes of Testcontainers writes to say the same thing.
    page-size: 100

# How long each source's facts stay fresh after it last stated them (#93). A short window for aws, so
# a fact ingested nine hours ago is stale while the default day still covers every other source.
freshness:
  windows:
    aws: PT6H

# The data lifecycle (#33). The archive is off by default everywhere else and a dry run when merely
# enabled; the acceptance suite opts in to purging so the scenario that archives can prove it, into a
# directory under the build. Its schedule never fires: the scenarios run it on demand. The migrations
# are a fixture, so the suite can hold a graph at an older ontology version and watch one apply.
lifecycle:
  archive:
    enabled: true
    mode: purge
    schedule: "0 0 5 31 2 ?"
    directory: build/lifecycle-archive
  migrations:
    location: classpath:ontology/migrations-fixture/
