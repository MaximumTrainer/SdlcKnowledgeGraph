# The controller slices test the API's statuses and bodies, not the gate in front of it (#114), so they
# run without Spring Boot's default security, which would otherwise wrap every @WebMvcTest in a login
# that is not the application's. The gate has its own slices (AuthGateWebTest, ScopeGateWebTest,
# AnonymousReadOnlyWebTest), which import SecurityConfig.
#
# An issuer, because an API with none may only start read-only (#118, AuthGuard). Nothing here ever
# fetches its keys: the slices that decode a token mock the decoder.
sdlc.auth.issuer-uri=https://issuer.example.test/realms/sdlc
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
