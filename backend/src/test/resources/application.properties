# The controller slices test the API's statuses and bodies, not the gate in front of it (#114), so they
# run with the development bypass, and without Spring Boot's default security, which would otherwise
# wrap every @WebMvcTest in a login that is not the application's. The gate has its own slice,
# AuthGateWebTest, which imports SecurityConfig and turns authentication on.
sdlc.auth.disabled=true
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
