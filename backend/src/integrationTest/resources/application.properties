# This suite exercises the API and its adapters, not the gate in front of them. It reads only what
# needs no token, and names an issuer because an API with none starts only read-only (#118). The
# issuer is never fetched: nothing here presents a token. Authentication is proved by the acceptance
# suite's auth features against a real Keycloak, and by AuthGateWebTest.
sdlc.auth.issuer-uri=https://issuer.test.invalid/realms/sdlc
# A key set URI too, because a decoder built from the issuer alone reads its discovery document at
# startup, while one built from a key set URI fetches nothing until it is asked to decode.
sdlc.auth.jwk-set-uri=https://issuer.test.invalid/realms/sdlc/protocol/openid-connect/certs
