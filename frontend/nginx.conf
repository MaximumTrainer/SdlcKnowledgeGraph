# The request's correlation id, passed to the API so a request can be followed from here into its
# logs (#44): the caller's X-Request-Id, or nginx's own when there is none. The API checks it and
# replaces one that is not safe to log, and echoes whichever it used.
map $http_x_request_id $sdlc_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Where the API lives and which DNS server resolves it, from the environment (see the Dockerfile
    # for the compose defaults; fly/fly.frontend.toml sets fly's). nginx's image substitutes them when
    # the container starts. Resolving the backend lazily (via a variable) lets nginx start even when
    # the API is not up yet, instead of failing at config-load time.
    resolver ${NGINX_RESOLVER};

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Liveness endpoint used by compose healthchecks and Playwright's webServer readiness probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Whether the web interface signs users in, and with which identity provider (#114): rendered from
    # OIDC_AUTHORITY and OIDC_CLIENT_ID when the container starts, so one image serves the default
    # stack (Keycloak) and a deployment with no identity provider (no authority: the API runs its
    # anonymous read-only mode, #118). Never cached, so a redeploy that turns the login on takes
    # effect on the next page load.
    location = /auth-config.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"authority":"${OIDC_AUTHORITY}","clientId":"${OIDC_CLIENT_ID}"}';
    }

    # Reverse-proxy the API to the backend service; the URI is passed through unchanged.
    location /api/ {
        set $backend ${BACKEND_URL};
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $sdlc_request_id;
    }

    # The three actuator endpoints a deployment answers publicly (docs/DEPLOYMENT.md D1, D2): the
    # probes, and what it is running. Exact matches, so the rest of the actuator - metrics, env,
    # configprops - stays unreachable from outside (D9) and falls through to the web interface.
    location ~ ^/actuator/(info|health/liveness|health/readiness)$ {
        set $backend ${BACKEND_URL};
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $sdlc_request_id;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other route is handled by the Vue router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
