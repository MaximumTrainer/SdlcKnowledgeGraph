server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving `backend` lazily (via a variable) lets nginx start even when the
    # API container is not up yet, instead of failing at config-load time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Liveness endpoint used by compose healthchecks and Playwright's webServer readiness probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Reverse-proxy the API to the backend service; the URI is passed through unchanged.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other route is handled by the Vue router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
