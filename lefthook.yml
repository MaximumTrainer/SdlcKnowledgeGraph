# Git hook gates for the SDLC Knowledge Graph (see docs/adr/0001-lefthook-git-hooks.md and docs/TESTING.md).
#
# Installed by `npm install` at the repo root (package.json "prepare" -> `lefthook install`).
# Gradle is always invoked through scripts/gradle.mjs so the same config works on Windows and POSIX.
#
# Division of labour: pre-commit is formatting and static analysis only, pre-push runs the tests.
# That is deliberate. Outside-in TDD requires committing a failing acceptance test before the code
# that satisfies it, so a hook that runs tests on commit would make the required workflow impossible
# without bypassing it. pre-push checks the state being shared, where intermediate red commits in the
# branch are fine as long as the tip is green.
#
# The guard jobs (protected-branch, hygiene, secrets) are neither formatting nor analysis and run no
# test: they refuse what cannot be undone once committed - a credential in the history, a
# multi-megabyte artefact, a change on `main` that skipped review. See docs/adr/0007-commit-guards.md.

commit-msg:
  jobs:
    - name: commitlint
      run: npx --no-install commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    # No glob on the three guards: they apply to every commit, whatever it touches.
    - name: protected-branch
      run: node scripts/protected-branch.mjs commit
    # Reads staged content from the index, so a partially staged file is judged as it will be committed.
    - name: hygiene
      run: node scripts/hygiene.mjs {staged_files}
    # A leaked credential must be rotated even after the commit is removed, so the only gate that
    # really helps is the one before it enters the history.
    - name: secrets
      run: node scripts/secretlint.mjs {staged_files}
    # Backend jobs run one after the other (piped) so ktlintFormat never rewrites files while detekt
    # is reading them; the group as a whole still runs in parallel with the frontend jobs.
    - name: backend
      group:
        piped: true
        jobs:
          - name: ktlint-format
            glob: "backend/**/*.{kt,kts}"
            run: node scripts/gradle.mjs ktlintFormat --quiet
            stage_fixed: true
          - name: detekt
            glob: "backend/**/*.{kt,kts}"
            run: node scripts/gradle.mjs detekt --quiet
    - name: frontend-lint
      root: frontend/
      glob: "*.{js,cjs,mjs,ts,vue}"
      run: npx --no-install eslint --fix {staged_files} && npx --no-install prettier --write {staged_files}
      stage_fixed: true
    - name: ontology-drift
      glob: "backend/src/main/resources/ontology/**"
      run: node scripts/gradle.mjs ontologyDriftCheck --quiet
    - name: website-drift
      glob: "{README.md,docs/**,website/src/**,website/scripts/**,backend/src/main/resources/ontology/**}"
      run: npm --prefix website run drift
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: node scripts/actionlint.mjs {staged_files}
    # A hook config that does not parse disables every gate above, silently.
    - name: lefthook-config
      glob: "lefthook.yml"
      run: node scripts/guards.mjs config

pre-push:
  parallel: true
  jobs:
    - name: protected-branch
      run: node scripts/protected-branch.mjs push
    - name: backend-check
      run: node scripts/gradle.mjs check --quiet
    # Piped so the pact check reads what `verify` has just regenerated; the group still runs in
    # parallel with the backend check.
    - name: frontend
      group:
        piped: true
        jobs:
          - name: frontend-verify
            root: frontend/
            run: npm run verify
          - name: pact-current
            run: git diff --exit-code -- contracts/pacts
